<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ambulance Dispatch</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0d13;
    color: #e2e4ea;
    min-height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    background: #13151f;
    border-bottom: 1px solid #1e2130;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar .logo { font-size: 22px; }
  .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: .02em; }
  .topbar .sub { font-size: 12px; color: #5a607a; margin-left: auto; }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
    animation: pulse 1.8s infinite;
    margin-left: auto;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
    height: calc(100vh - 57px);
  }

  /* ── Left panel — create case ── */
  .panel {
    background: #13151f;
    border-right: 1px solid #1e2130;
    padding: 28px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .panel-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #5a607a;
  }

  /* form */
  .form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 12px; color: #9aa0b8; margin-bottom: 4px; display: block; }
  input[type="text"], input[type="tel"] {
    width: 100%;
    background: #0b0d13;
    border: 1px solid #1e2130;
    border-radius: 8px;
    color: #e2e4ea;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: #3b82f6; }
  input::placeholder { color: #3a3f58; }

  .btn-create {
    background: #d32f2f;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, transform .1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-create:hover { background: #b71c1c; }
  .btn-create:active { transform: scale(.98); }
  .btn-create:disabled { background: #3a3f58; cursor: not-allowed; }

  /* result card */
  .result-card {
    background: #0b0d13;
    border: 1px solid #1e3a1e;
    border-radius: 10px;
    padding: 18px;
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .result-card.visible { display: flex; }
  .result-label { font-size: 11px; color: #22c55e; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .link-box {
    background: #13151f;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12px;
    color: #93c5fd;
    word-break: break-all;
    line-height: 1.5;
  }
  .btn-row { display: flex; gap: 8px; }
  .btn-copy, .btn-wa {
    flex: 1;
    border: none;
    border-radius: 7px;
    padding: 9px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-copy { background: #1e3a5f; color: #93c5fd; }
  .btn-wa   { background: #14532d; color: #4ade80; }
  .btn-copy:hover, .btn-wa:hover { opacity: .85; }
  #qrcode { display: flex; justify-content: center; }
  #qrcode canvas, #qrcode img { border-radius: 6px; }

  /* ── Right panel — cases table ── */
  .cases-panel {
    padding: 24px 28px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .cases-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cases-header h2 { font-size: 15px; font-weight: 700; }
  .case-count {
    font-size: 12px;
    background: #1e2130;
    padding: 3px 10px;
    border-radius: 999px;
    color: #9aa0b8;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #3a3f58;
    border-bottom: 1px solid #1e2130;
  }
  td {
    padding: 12px 12px;
    border-bottom: 1px solid #13151f;
    vertical-align: middle;
  }
  tr:hover td { background: #13151f; }
  tr.flash td { animation: rowflash 1.5s ease; }
  @keyframes rowflash {
    0%   { background: #14532d; }
    100% { background: transparent; }
  }

  .badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    display: inline-block;
  }
  .badge.pending { background:#3a3010; color:#e0b73f; }
  .badge.located { background:#14532d; color:#4ade80; }
  .badge.denied  { background:#3a1212; color:#f87171; }
  .badge.expired { background:#1e2130; color:#5a607a; }

  .map-link {
    color: #60a5fa;
    text-decoration: none;
    font-weight: 600;
    font-size: 12px;
  }
  .map-link:hover { text-decoration: underline; }

  .empty-state {
    color: #3a3f58;
    text-align: center;
    padding: 60px 0;
    font-size: 14px;
  }

  /* alert banner */
  .alert-banner {
    position: fixed;
    top: 20px; right: 20px;
    background: #14532d;
    border: 1px solid #22c55e;
    border-radius: 10px;
    padding: 14px 18px;
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #4ade80;
    z-index: 999;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
    animation: slidein .3s ease;
  }
  @keyframes slidein { from{transform:translateX(40px);opacity:0} to{transform:translateX(0);opacity:1} }
  .alert-banner.show { display: flex; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="logo">🚑</span>
  <h1>Ambulance Dispatch Console</h1>
  <div class="live-dot"></div>
  <span class="sub" id="lastUpdate">–</span>
</div>

<!-- Alert banner -->
<div class="alert-banner" id="alertBanner">
  <span>📍</span>
  <span id="alertText">Patient located!</span>
</div>

<div class="layout">

  <!-- Left: Create case -->
  <div class="panel">
    <div class="panel-title">New Emergency Case</div>

    <div class="form">
      <div>
        <label>Patient Name</label>
        <input type="text" id="patientName" placeholder="e.g. Muhammad Ali" />
      </div>
      <div>
        <label>WhatsApp Number</label>
        <input type="tel" id="patientPhone" placeholder="e.g. 03001234567" />
      </div>
      <button class="btn-create" id="createBtn" onclick="createCase()">
        <span>⚡</span> Generate Location Link
      </button>
    </div>

    <!-- Result card -->
    <div class="result-card" id="resultCard">
      <div class="result-label">✓ Link Ready — Send to Patient</div>
      <div class="link-box" id="linkBox">–</div>
      <div class="btn-row">
        <button class="btn-copy" onclick="copyLink()">📋 Copy Link</button>
        <button class="btn-wa" onclick="openWhatsApp()">💬 Open WhatsApp</button>
      </div>
      <div id="qrcode"></div>
    </div>
  </div>

  <!-- Right: Cases table -->
  <div class="cases-panel">
    <div class="cases-header">
      <h2>Live Cases</h2>
      <span class="case-count" id="caseCount">0 cases</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Patient</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Coordinates</th>
          <th>Accuracy</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-state" id="emptyState">No cases yet — create one on the left.</div>
  </div>
</div>

<audio id="alertSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhS0pikKarmXRUQUJqjaeol3ZYREdwm7GsnX1gSk96pryzoIZqUFOMr8GxpIxwWFiWtcS4rJV7YmGeuci8s56GaGWmv8q+r56GaWyqwcy/s6ONcG2tws3BtKOLcW6uw87BtaSLcW+uw87CtaOLcm+uw87CtaOLcW6uw87CtaSLcG2tw87CtaSLb2yuw87CtaSLcG2tw87CtaSLb2yuw87CtaSLcG2tw87CtaOLcW6uw87CtaOLcm+uw87CtaOLcW6uw87CtaSLcG2tw87CtaSLb2yuw87CtaSLcG2tw87BtaOLcW2uw87BtaKLb2ytw87CtaSLcG2tw87CtaSL" type="audio/wav">
</audio>

<script>
let currentLink = "";
let currentPhone = "";
let prevStatuses = {};
let qrInstance = null;

// ── Create case ──
async function createCase() {
  const name  = document.getElementById("patientName").value.trim();
  const phone = document.getElementById("patientPhone").value.trim();
  const btn   = document.getElementById("createBtn");

  if (!name || !phone) {
    alert("Please enter both patient name and phone number.");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = "<span>⏳</span> Generating...";

  try {
    const res = await fetch("/create", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ patient_name: name, phone: phone })
    });
    const data = await res.json();
    currentLink  = data.link;
    currentPhone = phone;
    showResult(data.link);
  } catch (e) {
    alert("Failed to create case. Please try again.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = "<span>⚡</span> Generate Location Link";
  }
}

function showResult(link) {
  document.getElementById("linkBox").textContent = link;
  document.getElementById("resultCard").classList.add("visible");

  // QR code
  const qrDiv = document.getElementById("qrcode");
  qrDiv.innerHTML = "";
  qrInstance = new QRCode(qrDiv, {
    text: link,
    width: 180,
    height: 180,
    colorDark: "#ffffff",
    colorLight: "#0b0d13",
    correctLevel: QRCode.CorrectLevel.M
  });
}

function copyLink() {
  navigator.clipboard.writeText(currentLink).then(() => {
    const btn = document.querySelector(".btn-copy");
    btn.textContent = "✓ Copied!";
    setTimeout(() => btn.textContent = "📋 Copy Link", 2000);
  });
}

function openWhatsApp() {
  if (!currentPhone || !currentLink) return;
  const digits = currentPhone.replace(/\D/g, "");
  // Prepend country code 92 for Pakistan if not already there
  const intl = digits.startsWith("92") ? digits : "92" + digits.replace(/^0/, "");
  const msg = encodeURIComponent(
    "🚑 *Emergency Location Request*\n\nPlease tap the link below and allow location access so the ambulance team can reach you:\n\n" + currentLink
  );
  window.open("https://wa.me/" + intl + "?text=" + msg, "_blank");
}

// ── Enter key on inputs ──
document.getElementById("patientPhone").addEventListener("keydown", e => {
  if (e.key === "Enter") createCase();
});
document.getElementById("patientName").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("patientPhone").focus();
});

// ── Poll for live updates ──
function showAlert(name) {
  const banner = document.getElementById("alertBanner");
  document.getElementById("alertText").textContent = `📍 ${name} has been located!`;
  banner.classList.add("show");
  // play beep
  try { document.getElementById("alertSound").play(); } catch(e){}
  setTimeout(() => banner.classList.remove("show"), 5000);
}

function render(cases) {
  const tbody      = document.getElementById("tbody");
  const emptyState = document.getElementById("emptyState");
  const caseCount  = document.getElementById("caseCount");
  const lastUpdate = document.getElementById("lastUpdate");

  caseCount.textContent = cases.length + " case" + (cases.length !== 1 ? "s" : "");
  lastUpdate.textContent = "Updated " + new Date().toLocaleTimeString();
  emptyState.style.display = cases.length ? "none" : "block";

  // detect newly located cases
  cases.forEach(c => {
    if (c.status === "located" && prevStatuses[c.token] === "pending") {
      showAlert(c.patient_name || "Patient");
    }
  });
  cases.forEach(c => prevStatuses[c.token] = c.status);

  tbody.innerHTML = cases.map(c => {
    const coords = (c.latitude && c.longitude)
      ? `<a class="map-link" target="_blank"
           href="https://maps.google.com/?q=${c.latitude},${c.longitude}">
           📍 ${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}
         </a>`
      : "—";
    const accuracy = c.accuracy ? Math.round(c.accuracy) + " m" : "—";
    const time = new Date(c.created_at).toLocaleTimeString();
    const isNew = (prevStatuses[c.token] === "located" && c.status === "located") ? "" : "";
    return `<tr id="row-${c.token}">
      <td><strong>${c.patient_name || "Unknown"}</strong></td>
      <td>${c.phone || "—"}</td>
      <td><span class="badge ${c.status}">${c.status}</span></td>
      <td>${coords}</td>
      <td>${accuracy}</td>
      <td>${time}</td>
    </tr>`;
  }).join("");
}

function poll() {
  fetch("/api/cases").then(r => r.json()).then(render).catch(() => {});
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
