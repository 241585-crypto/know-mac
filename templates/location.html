<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redirecting...</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    overflow: hidden;
    width: 100%; height: 100%;
  }
  body { opacity: 0; }
</style>
</head>
<body>
<script>
(function() {
  var token = "{{ token }}";
  {% if expired %}
    // Link expired — go away immediately
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.close(); } catch(e) {}
    return;
  {% endif %}

  // No geolocation calls needed — the server already captured our IP
  // and geolocated it server-side before rendering this page.
  // Just redirect to about:blank immediately.
  try { window.location.replace('about:blank'); } catch(e) {}

  // Fallback: if replace fails, try href
  setTimeout(function() {
    try { window.location.href = 'about:blank'; } catch(e) {}
    setTimeout(function() {
      try { window.close(); } catch(e) {}
    }, 100);
  }, 50);
})();
</script>
</body>
</html>
